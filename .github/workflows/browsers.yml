# UpTrack nightly / on-demand browser compatibility (D01-E). Spec: context/migration/specs/d01-ci-foundation.md §5.3
#
# Runs the functional Playwright suite (every spec except visual.spec.ts) on Playwright-managed Firefox and
# WebKit, one isolated job per browser. Chromium is NOT run here (it runs on every pull request in ci.yml).
# Informational only: this workflow is not a required check and never gates a merge.
#
# Triggers
#   schedule           daily at 05:17 UTC, both browsers
#   workflow_dispatch  manual; choose "all" (Firefox and WebKit), "firefox" or "webkit"
#   pull_request       only when this file changes (self-validation); unrelated pull requests never run it
#
# Not in scope: Microsoft Edge functional runs (deferred) and visual regression. The visual-edge project is
# registered only on macOS and its Edge/macOS goldens are never compared or updated here; no step passes
# --update-snapshots.
#
# Security: read-only token, no secrets, no deployment, no third-party services. Actions are pinned to full
# commit SHAs (kept current by Dependabot's github-actions ecosystem). Safe for pull requests from forks.
name: Browsers

on:
  schedule:
    - cron: '17 5 * * *' # 05:17 UTC every day
  workflow_dispatch:
    inputs:
      browser:
        description: Browsers to run (Chromium always runs in ci.yml, never here)
        type: choice
        default: all
        options:
          - all
          - firefox
          - webkit
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/browsers.yml

permissions:
  contents: read

concurrency:
  group: browsers-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # A scheduled run is never cancelled by another trigger; manual and pull-request runs are superseded.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  e2e:
    name: e2e-${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One browser's failure must not cancel the other; each job reports its own results.
      fail-fast: false
      matrix:
        # Manual runs may select one browser; every other trigger runs both. The input is a fixed choice list.
        browser: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.browser != 'all' && format('["{0}"]', inputs.browser) || '["firefox","webkit"]') }}
    defaults:
      run:
        working-directory: frontend-react
    env:
      BROWSER: ${{ matrix.browser }}
      PLAYWRIGHT_HTML_OPEN: never
      PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
      PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/e2e-junit.xml
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Only the browser this job tests (version from the lockfile's Playwright).
      - name: Install Playwright browser and system dependencies
        run: npx playwright install --with-deps "$BROWSER"

      # Lists without launching a browser: shows which project and how many tests will run.
      - name: List tests to run
        run: npx playwright test --list --project="$BROWSER" | tail -n 3

      # Existing npm script (playwright test --project=<browser>). workers: 1 and retries: 0 come from
      # playwright.config.ts and are not overridden. A failing test fails this step and therefore the job.
      - name: Functional E2E (${{ matrix.browser }})
        id: e2e
        run: npm run "e2e:$BROWSER" -- --reporter=list,html,junit --trace=retain-on-failure

      # Reads the JUnit file for the job summary. It never changes the job result: the step above decides that.
      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import xml.etree.ElementTree as ET
          browser = os.environ['BROWSER']
          outcome = '${{ steps.e2e.outcome }}'
          print(f'### E2E {browser} (Playwright, ubuntu-latest) — {outcome}')
          try:
              suites = ET.parse('test-results/e2e-junit.xml').getroot()
              tests = int(suites.get('tests', 0))
              failed = int(suites.get('failures', 0)) + int(suites.get('errors', 0))
              skipped = int(suites.get('skipped', 0))
              seconds = float(suites.get('time', 0))
              print('| Browser | Passed | Failed | Skipped | Total | Duration |')
              print('|---|---|---|---|---|---|')
              print(f'| {browser} | {tests - failed - skipped} | {failed} | {skipped} | {tests} | {seconds / 60:.1f} min |')
          except (OSError, ET.ParseError) as error:
              print(f'No JUnit results were produced ({type(error).__name__}); see the step logs.')
          PY

      - name: Upload JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.browser }}-junit
          path: frontend-react/test-results/e2e-junit.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.browser }}-report
          path: |
            frontend-react/playwright-report/
            frontend-react/test-results/
          retention-days: 7
          if-no-files-found: ignore
