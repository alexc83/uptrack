name: "Maintenance task"
description: "Track upkeep, tooling or technical debt"
labels: [maintenance]
body:
  - type: markdown
    attributes:
      value: "Search existing issues first. Sensitive findings: https://github.com/alexc83/uptrack/security/advisories/new — never post credentials or user data here."
  - type: textarea
    id: condition
    attributes:
      label: "Current condition and desired result"
      description: "Explain the reason for this work."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Scope and compatibility"
      description: "Include exclusions, dependencies and rollback considerations."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance criteria"
      description: "State measurable completion and verification."
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Related issues, specification and evidence
      description: Link existing work; do not duplicate it.
