name: "Bug report"
description: "Report a reproducible defect"
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Search existing issues first. Sensitive findings: https://github.com/alexc83/uptrack/security/advisories/new — never post credentials or user data here."
  - type: textarea
    id: behavior
    attributes:
      label: "Expected and actual behavior"
      description: "Describe both outcomes."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Reproduction and confidence"
      description: "Steps, environment/build, observed versus suspected behavior."
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: "Impact"
      description: "Who or what is affected?"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance criteria"
      description: "How will the fix be verified?"
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Related issues, specification and evidence
      description: Link existing work; do not duplicate it.
