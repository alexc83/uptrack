name: "Feature request"
description: "Propose a scoped product improvement"
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Search existing issues first. Sensitive findings: https://github.com/alexc83/uptrack/security/advisories/new — never post credentials or user data here."
  - type: textarea
    id: problem
    attributes:
      label: "User problem and intended outcome"
      description: "What need does this address?"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Scope and exclusions"
      description: "Define boundaries and unresolved decisions."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance scenarios"
      description: "Include relevant empty/error/mobile/accessibility behavior."
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Related issues, specification and evidence
      description: Link existing work; do not duplicate it.
