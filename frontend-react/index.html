<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UpTrack — Credential &amp; CE Tracking</title>
    <script>
      (function() {
        var theme;
        try { theme = localStorage.getItem('uptrack-theme'); } catch (e) {}
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = theme === 'dark' || (theme !== 'light' && theme !== 'dark' && prefersDark);
        document.documentElement.classList.toggle('dark', Boolean(dark));
      })();
    </script>
    <link rel="stylesheet" href="/src/styles/globals.css" />
  </head>
  <body class="min-h-screen bg-[var(--ut-main-bg)] text-ut-text antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
