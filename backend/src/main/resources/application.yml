server:
  port: ${SERVER_PORT:8080}
  # The container never trusts client-supplied forwarding headers; client identity for
  # rate limiting is resolved only through the explicit app.trusted-proxies allowlist.
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    # Drain ordinary rejected requests so clients receive 413 instead of a reset.
    # Keep this bounded: a reverse proxy must cap larger bodies before forwarding.
    max-swallow-size: 8MB

spring:
  autoconfigure:
    # The app uses its own JWT filter chain; do not create or log Spring's generated
    # default development user/password.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: uptrack-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: info

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}
    expiration-seconds: ${AUTH_JWT_EXPIRATION_SECONDS}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

app:
  cors:
    allowed-origin-patterns: ${ALLOWED_ORIGIN_PATTERNS:http://localhost:4200,http://127.0.0.1:4200}
  # Comma-separated IPs/CIDRs of reverse proxies whose X-Forwarded-For/Forwarded headers
  # may be trusted when resolving the client identity for rate limiting. EMPTY by default:
  # then only the direct peer address is used and all forwarding headers are ignored.
  # When set, block direct (non-proxy) access to the backend at the network level.
  trusted-proxies: ${TRUSTED_PROXIES:}
  security:
    # Cap for non-multipart request bodies (multipart is capped separately above).
    max-request-body-bytes: ${MAX_REQUEST_BODY_BYTES:1048576}
  certificates:
    delivery:
      # Phase 3 (#23) rollout gate — server-controlled, DEFAULT OFF. While off, uploads stay
      # delivery type 'upload' and permanent URLs remain in responses (Phase 2 behavior); the
      # authenticated delivery endpoint issues nothing. Deployment/activation require separate
      # authorization; automated tests do not prove live-provider confidentiality.
      enabled: ${CERTIFICATE_DELIVERY_ENABLED:false}
      # Explicit expiry for signed API download URLs; live provider enforcement remains unverified.
      ttl-seconds: ${CERTIFICATE_DELIVERY_TTL_SECONDS:60}
  upload:
    # Concurrent certificate validate+upload operations; excess requests get 503, never queue.
    max-concurrent: ${MAX_CONCURRENT_UPLOADS:4}
    # Phase 1 (#24) reservation reconciliation: a RESERVED asset row is created before the
    # Cloudinary call; this sweeper probes the Admin API for uncertain outcomes (crash/timeout).
    sweeper-enabled: ${UPLOAD_SWEEPER_ENABLED:true}
    sweeper-interval-ms: ${UPLOAD_SWEEPER_INTERVAL_MS:60000}
    sweeper-batch-size: ${UPLOAD_SWEEPER_BATCH_SIZE:20}
    reservation-grace-minutes: ${UPLOAD_RESERVATION_GRACE_MINUTES:10}
    reconciliation-delay-seconds: ${UPLOAD_RECONCILIATION_DELAY_SECONDS:60}
  cleanup:
    # Phase 2 (#20) durable cleanup worker: fenced-lease processing of PENDING_DELETION assets and
    # 24 h expiry of abandoned unattached uploads. PostgreSQL + Spring scheduling only.
    enabled: ${CLEANUP_WORKER_ENABLED:true}
    interval-ms: ${CLEANUP_WORKER_INTERVAL_MS:60000}
    batch-size: ${CLEANUP_BATCH_SIZE:50}
    lease-seconds: ${CLEANUP_LEASE_SECONDS:300}
    max-attempts: ${CLEANUP_MAX_ATTEMPTS:10}
    abandoned-grace-hours: ${CLEANUP_ABANDONED_GRACE_HOURS:24}
