server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none
  tomcat:
    # Drain ordinary rejected requests so clients receive 413 instead of a reset.
    # Keep this bounded: a reverse proxy must cap larger bodies before forwarding.
    max-swallow-size: 8MB

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: uptrack-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: info

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}
    expiration-seconds: ${AUTH_JWT_EXPIRATION_SECONDS}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

app:
  cors:
    allowed-origin-patterns: ${ALLOWED_ORIGIN_PATTERNS:http://localhost:4200,http://127.0.0.1:4200}
